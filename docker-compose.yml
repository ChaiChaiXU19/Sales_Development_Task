services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: sales-brainstorm-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_DB: sales_brainstorm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sales_brainstorm"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgvector_data:
